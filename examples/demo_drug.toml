# Hardware demo (pharmacology): drug reabsorption with a 2 h transit delay,
# A1' = -0.8 A1 + 0.4 A2(t-2), A2' = 0.5 A1 - 0.6 A2; history = dominant characteristic mode.
[problem]
name    = "drug reabsorption (demo)"
dim     = 2
T       = 2.0
A       = [[-0.8, 0.0], [0.5, -0.6]]
history = ["0.8724200573*exp(-0.16378997114007995*t)", "exp(-0.16378997114007995*t)"]

[[delay]]
tau = 2.0
B   = [[0.0, 0.4], [0.0, 0.0]]

[discretization]
degree       = 1
element_size = 2.0

[target]
eps = 1e-2
